lvgl:
  pages:
    - id: main_page
      widgets:
        - label:
            align: TOP_MID
            y: 20
            text: "Home Panel"

        - button:
            id: external_garage_button
            x: 40
            y: 90
            width: 220
            height: 90
            widgets:
              - label:
                  id: external_garage_label
                  align: CENTER
                  text: "External Garage"
            on_click:
              - homeassistant.action:
                  action: cover.toggle
                  data:
                    entity_id: cover.external_garage

        - button:
            id: internal_garage_button
            x: 290
            y: 90
            width: 220
            height: 90
            widgets:
              - label:
                  id: internal_garage_label
                  align: CENTER
                  text: "Internal Garage"
            on_click:
              - homeassistant.action:
                  action: cover.toggle
                  data:
                    entity_id: cover.internal_garage

        - button:
            id: outside_lights_button
            x: 540
            y: 90
            width: 220
            height: 90
            checkable: true
            widgets:
              - label:
                  align: CENTER
                  text: "Outside Lights"
            on_click:
              - homeassistant.action:
                  action: light.toggle
                  data:
                    entity_id: light.outside_lights

        - button:
            id: garage_floor_lights_button
            x: 40
            y: 210
            width: 220
            height: 90
            checkable: true
            widgets:
              - label:
                  align: CENTER
                  text: "Garage Lights"
            on_click:
              - homeassistant.action:
                  action: light.toggle
                  data:
                    entity_id: light.garage_floor_lights

        - button:
            id: all_outside_off_button
            x: 290
            y: 210
            width: 220
            height: 90
            widgets:
              - label:
                  align: CENTER
                  text: "Outside OFF"
            on_click:
              - homeassistant.action:
                  action: light.turn_off
                  data:
                    entity_id: light.outside_lights

        - button:
            id: restart_panel_button
            x: 540
            y: 210
            width: 220
            height: 90
            widgets:
              - label:
                  align: CENTER
                  text: "Restart Panel"
            on_click:
              - button.press: restart_button

        - label:
            id: home_temperature_label
            x: 40
            y: 350
            text: "Temp: --°C"

        - label:
            id: weather_label
            x: 40
            y: 395
            text: "Weather: --"

        - label:
            id: maintenance_label
            x: 290
            y: 350
            text: "Maintenance: --"

        - label:
            id: display_time
            align: TOP_RIGHT
            x: -20
            y: 15
            text: "--:--"

        - label:
            align: CENTER
            text: "ESPHome LCD 7"
